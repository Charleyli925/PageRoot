<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>结构保留文字编辑</title>
  <style>
    body {
      margin: 0;
      padding: 48px;
      font: 18px/1.8 system-ui, sans-serif;
    }

    li, p {
      max-width: 680px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <ol>
    <li data-native-case="nested-list-title">发现阶段<ul data-keep="yes"><li>访谈 12 位内容创作者</li><li>审计现有流程</li></ul></li>
  </ol>
  <p data-native-case="wbr-text">软换行机会：Hypertext<wbr>Markup<wbr>Language</p>
</body>
</html>
