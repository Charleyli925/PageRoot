<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>样式与范围校验样本</title>
  <style>
    :root { --brand-primary: #2563eb; }
    .shared-title { color: var(--brand-primary); margin: 8px; }
    @media (max-width: 720px) {
      .shared-title { font-size: 18px; }
    }
  </style>
  <style media="print">.shared-title { color: black; }</style>
</head>
<body>
  <section id="allowed">
    <h2 class="shared-title" data-order=one style='color: red; padding: 4px !important'>允许目标</h2>
    <p>允许修改的正文</p>
  </section>
  <section id="outside">
    <h2 class="shared-title">范围外目标</h2>
    <p>范围外必须逐字符保持</p>
  </section>
  <script>window.scopeFixture = { untouched: true };</script>
</body>
</html>
