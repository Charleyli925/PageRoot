name: CI Health

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-health
  cancel-in-progress: true

jobs:
  dependency-health:
    name: dependency-health
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - name: Audit dependencies and packaged runtime closure
        run: npm run audit:dependencies

  report:
    name: thirty-day-report
    needs: dependency-health
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - name: Calculate release-pipeline health
        env:
          DEPENDENCY_HEALTH_RESULT: ${{ needs.dependency-health.result }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci-health-report.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --days 30 \
            --output output/ci-health/ci-health.json
      - name: Upload machine-readable report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PageRoot-ci-health-${{ github.run_id }}
          path: output/ci-health/ci-health.json
          if-no-files-found: error
          retention-days: 90
