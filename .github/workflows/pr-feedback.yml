name: PR Feedback

on:
  pull_request:
    # ready_for_review is intentionally owned by ci.yml. A later synchronize
    # receives cheap feedback but no release-gate for the new head, so the PR
    # must be explicitly promoted again before it can merge.
    types: [opened, synchronize, reopened, converted_to_draft]

permissions:
  actions: read
  contents: read

concurrency:
  # Shared with ci.yml so a new commit cancels an in-flight complete gate for
  # the stale Pull Request head instead of letting both runs finish.
  group: pageroot-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feedback:
    name: pr-feedback
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: Restore Electron download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Enforce PageRoot branch naming
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: npm run task:policy -- "$BRANCH_NAME"
      - name: Run impact-selected Pull Request feedback
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          node scripts/ci-evidence.mjs run
          --suite pr-feedback
          --stage pr-feedback
          --
          npm run gate:edit -- --base "$PR_BASE_SHA"
      - name: Upload feedback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PageRoot-pr-feedback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci-evidence
            output/test-runs
          if-no-files-found: warn
          retention-days: 14
