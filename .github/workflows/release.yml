name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: build-and-publish
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run release:mac
      - run: npm run release:assets -- --arch arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PageRoot-${{ github.ref_name }}-arm64
          path: |
            release/PageRoot-*-arm64.dmg
            release/SHA256SUMS.txt
            release/update-manifest.json
            release/build-info.json
          if-no-files-found: error
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" \
            "release/PageRoot-${VERSION}-arm64.dmg" \
            "release/SHA256SUMS.txt" \
            "release/update-manifest.json" \
            "release/build-info.json" \
            --verify-tag \
            --generate-notes \
            --title "PageRoot ${VERSION}"
