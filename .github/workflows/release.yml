name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build-and-publish
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Check for reusable exact-tree PR source gate
        id: source-gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/source-gate-provenance.mjs verify \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --max-age-hours 168 \
            --mode advisory \
            --github-output "$GITHUB_OUTPUT"
      - name: Restore Electron and builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Restore Playwright Chromium for source-gate fallback
        if: steps.source-gate.outputs.trusted != 'true'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium for source-gate fallback
        if: steps.source-gate.outputs.trusted != 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Build and verify installer from attested source
        if: steps.source-gate.outputs.trusted == 'true'
        env:
          PAGEROOT_SOURCE_GATE_TRUSTED: ${{ steps.source-gate.outputs.trusted }}
          PAGEROOT_SOURCE_GATE_TREE: ${{ steps.source-gate.outputs.tree_sha }}
          PAGEROOT_SOURCE_GATE_VERSION: ${{ steps.source-gate.outputs.package_version }}
        run: npm run gate:artifact-only:auto
      - name: Re-run complete source and installer gate
        if: steps.source-gate.outputs.trusted != 'true'
        run: npm run release:mac
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PageRoot-Release-diagnostics-${{ github.run_attempt }}
          path: |
            output/test-runs
            output/playwright
          if-no-files-found: warn
          retention-days: 7
      - run: npm run release:assets -- --arch arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PageRoot-${{ github.ref_name }}-arm64
          path: |
            release/PageRoot-*-arm64.dmg
            release/SHA256SUMS.txt
            release/update-manifest.json
            release/build-info.json
          if-no-files-found: error
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" \
            "release/PageRoot-${VERSION}-arm64.dmg" \
            "release/SHA256SUMS.txt" \
            "release/update-manifest.json" \
            "release/build-info.json" \
            --verify-tag \
            --generate-notes \
            --title "PageRoot ${VERSION}"
