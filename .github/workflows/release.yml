name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: build-and-publish
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run release:mac
      - run: npm run release:assets -- --arch arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PageRoot-${{ github.ref_name }}-arm64
          path: |
            release/PageRoot-*-arm64.dmg
            release/SHA256SUMS.txt
            release/update-manifest.json
            release/build-info.json
          if-no-files-found: error
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" \
            "release/PageRoot-${VERSION}-arm64.dmg" \
            "release/SHA256SUMS.txt" \
            "release/update-manifest.json" \
            "release/build-info.json" \
            --verify-tag \
            --generate-notes \
            --title "PageRoot ${VERSION}"
