name: CI

on:
  push:
    branches: [main]
  pull_request:
    # A ready transition is an explicit, one-shot promotion of the current
    # Pull Request head. Ordinary updates are handled by pr-feedback.yml and
    # deliberately do not recreate the required release-gate check.
    types: [ready_for_review]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  # Shared with pr-feedback.yml so a new commit cancels an in-flight complete
  # gate for the stale Pull Request head.
  group: pageroot-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-settled:
    name: review-settled
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - name: Wait for Draft and post-Ready exact-SHA Codex reviews to settle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/check-pr-review-settled.mjs
          --repository "$GITHUB_REPOSITORY"
          --pull-request "${{ github.event.pull_request.number }}"
          --expected-head "${{ github.event.pull_request.head.sha }}"
          --expected-base "${{ github.event.pull_request.base.sha }}"
          --settle-seconds 180
          --timeout-seconds 1200
          --poll-seconds 20

  branch-policy:
    name: branch-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - name: Enforce PageRoot branch naming
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: npm run task:policy -- "$BRANCH_NAME"

  baseline-policy:
    name: baseline-policy
    if: github.event_name == 'pull_request'
    needs:
      - review-settled
      - branch-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - name: Audit dependencies and packaged runtime closure
        run: npm run audit:dependencies

  source-build:
    name: source-build
    if: github.event_name == 'pull_request'
    needs:
      - review-settled
      - baseline-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: Restore Electron download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Run static checks and build the shared web renderer
        run: >-
          node scripts/ci-evidence.mjs run
          --suite source-build
          --stage source-build
          --
          npm run ci:source-build:prepared
      - name: Upload shared web build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PageRoot-web-build-${{ github.run_id }}
          path: |
            dist
            package.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Upload source-build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PageRoot-source-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-evidence
          if-no-files-found: warn
          retention-days: 30

  source-node:
    name: source-node
    if: github.event_name == 'pull_request'
    needs: source-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: Restore Electron download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Download shared web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PageRoot-web-build-${{ github.run_id }}
          path: .
      - name: Run full Node suite
        run: >-
          node scripts/ci-evidence.mjs run
          --suite source-node
          --stage source-test
          --
          npm run test:node:full:prepared
      - name: Upload Node evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PageRoot-source-node-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-evidence
          if-no-files-found: warn
          retention-days: 30

  source-browser:
    name: browser-${{ matrix.label }}
    if: github.event_name == 'pull_request'
    needs: source-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: shard-1-of-3
            command: npm run test:browser:full:prepared -- --fully-parallel --workers=1 --shard=1/3
          - label: shard-2-of-3
            command: npm run test:browser:full:prepared -- --fully-parallel --workers=1 --shard=2/3
          - label: shard-3-of-3
            command: npm run test:browser:full:prepared -- --fully-parallel --workers=1 --shard=3/3
          - label: real-html
            command: npm run test:real-html:prepared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: Restore Electron download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Download shared web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PageRoot-web-build-${{ github.run_id }}
          path: .
      - name: Run ${{ matrix.label }}
        run: >-
          node scripts/ci-evidence.mjs run
          --suite browser-${{ matrix.label }}
          --stage source-test
          --
          ${{ matrix.command }}
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PageRoot-browser-${{ matrix.label }}-diagnostics-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: warn
          retention-days: 7
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PageRoot-browser-${{ matrix.label }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-evidence
          if-no-files-found: warn
          retention-days: 30

  source-electron-native:
    name: electron-native
    if: github.event_name == 'pull_request'
    needs:
      - review-settled
      - baseline-policy
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: Restore Electron download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Prove hosted renderer scheduling before product tests
        run: >-
          node scripts/ci-evidence.mjs run
          --suite electron-native-preflight
          --stage environment-preflight
          --
          npm run test:electron:ci-preflight:prepared
      - name: Build Electron renderer on the target OS
        run: >-
          node scripts/ci-evidence.mjs run
          --suite electron-native-renderer
          --stage source-build
          --
          npm run desktop:renderer
      - name: Run native Electron suite
        run: >-
          node scripts/ci-evidence.mjs run
          --suite electron-native
          --stage source-test
          --
          npm run test:electron:full:prepared
      - name: Upload native Electron failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PageRoot-electron-native-diagnostics-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: warn
          retention-days: 7
      - name: Upload native Electron evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PageRoot-electron-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-evidence
          if-no-files-found: warn
          retention-days: 30

  source-electron-ai:
    name: electron-ai
    if: github.event_name == 'pull_request'
    needs:
      - review-settled
      - baseline-policy
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: Restore Electron download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Prove hosted renderer scheduling before AI tests
        run: >-
          node scripts/ci-evidence.mjs run
          --suite electron-ai-preflight
          --stage environment-preflight
          --
          npm run test:electron:ci-preflight:prepared
      - name: Build Electron renderer on the target OS
        run: >-
          node scripts/ci-evidence.mjs run
          --suite electron-ai-renderer
          --stage source-build
          --
          npm run desktop:renderer
      - name: Run deterministic AI closed-loop suite
        run: >-
          node scripts/ci-evidence.mjs run
          --suite electron-ai
          --stage source-test
          --
          npm run test:ai-closed-loop:prepared
      - name: Upload AI Electron failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PageRoot-electron-ai-diagnostics-${{ github.run_attempt }}
          path: output/playwright
          if-no-files-found: warn
          retention-days: 7
      - name: Upload AI Electron evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PageRoot-electron-ai-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-evidence
          if-no-files-found: warn
          retention-days: 30

  release-gate:
    name: release-gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - review-settled
      - baseline-policy
      - branch-policy
      - source-build
      - source-node
      - source-browser
      - source-electron-native
      - source-electron-ai
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every source lane
        env:
          REVIEW_RESULT: ${{ needs.review-settled.result }}
          BASELINE_RESULT: ${{ needs.baseline-policy.result }}
          POLICY_RESULT: ${{ needs.branch-policy.result }}
          BUILD_RESULT: ${{ needs.source-build.result }}
          NODE_RESULT: ${{ needs.source-node.result }}
          BROWSER_RESULT: ${{ needs.source-browser.result }}
          ELECTRON_NATIVE_RESULT: ${{ needs.source-electron-native.result }}
          ELECTRON_AI_RESULT: ${{ needs.source-electron-ai.result }}
        run: |
          test "$REVIEW_RESULT" = "success"
          test "$BASELINE_RESULT" = "success"
          test "$POLICY_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
          test "$NODE_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
          test "$ELECTRON_NATIVE_RESULT" = "success"
          test "$ELECTRON_AI_RESULT" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Revalidate frozen head/base review evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/check-pr-review-settled.mjs
          --repository "$GITHUB_REPOSITORY"
          --pull-request "${{ github.event.pull_request.number }}"
          --expected-head "${{ github.event.pull_request.head.sha }}"
          --expected-base "${{ github.event.pull_request.base.sha }}"
          --settle-seconds 180
          --timeout-seconds 60
          --poll-seconds 10
      - name: Create exact-tree source gate attestation
        id: provenance
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/source-gate-provenance.mjs create \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request "$PR_NUMBER" \
            --pull-request-head "$PR_HEAD_SHA" \
            --pull-request-base "$PR_BASE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload exact-tree source gate attestation
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.provenance.outputs.artifact_name }}
          path: output/source-gate/source-gate.json
          if-no-files-found: error
          retention-days: 30

  main-integrity:
    name: main-integrity
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - name: Verify PR result, exact tree, version and freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/source-gate-provenance.mjs verify \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --max-age-hours 168 \
            --mode required
