name: Draft Codex Review

# Trusted default-branch probe. GitHub runs `issue_comment` workflows from the
# default branch's file only, so these bytes can never be replaced by a Pull
# Request branch. A maintainer posts one machine-parsed command comment; this
# job verifies the author, the exact head/base and the live Draft state, posts
# at most one @codex review comment per exact pair, and closes its own marker
# once the probe round settles while the Pull Request is still Draft.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pageroot-draft-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  probe:
    name: draft-review-probe
    if: >-
      github.event.issue.pull_request
      && contains(github.event.comment.body, 'pageroot-draft-review-command:v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - name: Apply one exact-pair Draft Codex review command
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: >-
          node scripts/draft-review-request.mjs
          --repository "$GITHUB_REPOSITORY"
          --pull-request "$ISSUE_NUMBER"
          --comment-id "$COMMENT_ID"
      - name: Upload draft review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PageRoot-draft-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/draft-review/draft-review.json
          if-no-files-found: warn
          retention-days: 14
