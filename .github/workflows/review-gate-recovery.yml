name: Review Gate Recovery

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pageroot-review-gate-recovery-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  recover:
    name: recover-late-final-review
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && (github.event.comment.user.login == 'chatgpt-codex-connector'
          || github.event.comment.user.login == 'chatgpt-codex-connector[bot]'))
      || (github.event_name == 'pull_request_review'
        && (github.event.review.user.login == 'chatgpt-codex-connector'
          || github.event.review.user.login == 'chatgpt-codex-connector[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # This job owns actions:write, so it executes only trusted default-branch
      # code. It never checks out, runs, changes, or merges Pull Request bytes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - name: Recover an exact-pair review timeout without rerunning green jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/recover-pr-review-gate.mjs
          --repository "$GITHUB_REPOSITORY"
          --event-name "$GITHUB_EVENT_NAME"
          --event-path "$GITHUB_EVENT_PATH"
          --settle-seconds 30
          --wait-seconds 120
          --poll-seconds 10
      - name: Upload review-gate recovery decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PageRoot-review-gate-recovery-${{ github.run_id }}
          path: output/review-gate-recovery/recovery.json
          if-no-files-found: warn
          retention-days: 30
